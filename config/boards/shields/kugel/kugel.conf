# Clock Configuration for BLE Micro Pro (NO external crystal)
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_500PPM=y

# Pointing / Trackball support
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y

# Enable Custom Drivers
CONFIG_SPI=y
CONFIG_KSCAN_KUGEL=y
CONFIG_PAW3204=y

# ZMK Studio Support (USB Wired Serial RPC & BLE Web Transport)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_TRANSPORT_UART=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y
CONFIG_ZMK_PHYSICAL_LAYOUT_KEY_ROTATION=y

# Disable Console Logging on UART to prevent "Port in use / Access Denied"
CONFIG_CONSOLE=n
CONFIG_LOG=n

# Bluetooth & Settings (Windows Compatibility & PIN-less Just Works Pairing)
CONFIG_ZMK_BLE=y
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_SIGNING=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_BT_MAX_PAIRED=5
CONFIG_BT_MAX_CONN=5
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_PRIVACY=n
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n
CONFIG_BT_DEVICE_NAME="Kugel"

# Power Management & Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_PM_DEVICE=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# USB
CONFIG_ZMK_USB=y
CONFIG_ZMK_USB_BOOT=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="Kugel"
CONFIG_USB_CDC_ACM=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# Battery Monitoring for Single AA Battery (matching QMK: 700mV - 1300mV)
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_NON_LIPO_BATTERY_MANAGEMENT=y
CONFIG_ZMK_NON_LIPO_MIN_MV=800
CONFIG_ZMK_NON_LIPO_MAX_MV=1300
CONFIG_ZMK_NON_LIPO_LOW_MV=700
CONFIG_ZMK_NON_LIPO_ADV_SLEEP_TIMEOUT=180000

# Bluetooth Transmit Power (BLE Micro Pro / BL654 requires +8dBm for robust connection)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y


# Prospector Scanner Status Advertisement
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_KEYBOARD_NAME="Kugel"
CONFIG_PROSPECTOR_MAX_LAYERS=7
CONFIG_PROSPECTOR_CHANNEL=0
CONFIG_ZMK_STATUS_ADV_ACTIVITY_BASED=y
CONFIG_ZMK_STATUS_ADV_ACTIVE_INTERVAL_MS=1000
CONFIG_ZMK_STATUS_ADV_IDLE_INTERVAL_MS=30000
CONFIG_ZMK_STATUS_ADV_ACTIVITY_TIMEOUT_MS=5000
